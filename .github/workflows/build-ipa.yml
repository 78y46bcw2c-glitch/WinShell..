name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq "WinShell-project 2.zip"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project WinShell.xcodeproj \
            -scheme WinShell \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build > build.log 2>&1 || {
              echo "=== ERRORS ==="
              grep -E "error:" build.log | sed 's#.*/WinShell/##' | sort -u
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WinShell.app Payload/
          zip -qr WinShell.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinShell-ipa
          path: WinShell.ipa
